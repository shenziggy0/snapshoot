name: Unsigned installers

# Manual only. Do not auto-build on push, including cursor/** branches.
# macOS runners cost 10x minutes. The v1.0.0 release build is package.yml.
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-macos-aarch64:
        name: macOS aarch64 dmg
        runs-on: macos-14
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 21

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build unsigned dmg
              run: |
                  pnpm tauri build --target aarch64-apple-darwin --bundles app
                  python3 scripts/package_macos.py --app src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Snapshoot.app --output-dir src-tauri/target/aarch64-apple-darwin/release/bundle/dmg --arch aarch64

            - name: Upload dmg
              uses: actions/upload-artifact@v4
              with:
                  name: Snapshoot-macos-aarch64-apple-darwin-dmg
                  path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
                  if-no-files-found: error
