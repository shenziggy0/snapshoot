name: Unsigned installers

# Manual only. Does not run on push (including cursor/**).
# macOS runners cost 10x minutes. Dispatch this workflow to build only the
# Apple silicon dmg. Windows, Intel dmg, and smoke tests stay in
# unsigned-optional.yml.
on:
    workflow_dispatch:
        inputs:
            macos_aarch64:
                description: Build only the Apple silicon dmg
                type: boolean
                default: true

permissions:
    contents: read

jobs:
    build-macos-aarch64:
        name: macOS aarch64 dmg
        if: inputs.macos_aarch64 == true
        runs-on: macos-14
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 21

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build unsigned dmg
              run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg

            - name: Upload dmg
              uses: actions/upload-artifact@v4
              with:
                  name: Snapshoot-macos-aarch64-apple-darwin-dmg
                  path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
                  if-no-files-found: error
