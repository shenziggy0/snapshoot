name: Unsigned installers

# Builds unsigned Windows x64 and macOS installers without Apple or updater signing keys.
on:
    workflow_dispatch:
    push:
        branches:
            - 'cursor/**'

permissions:
    contents: read

jobs:
    build-windows-x64:
        name: Windows x64 (NSIS + MSI)
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 21

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build unsigned NSIS and MSI
              run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi

            - name: Upload NSIS installer
              uses: actions/upload-artifact@v4
              with:
                  name: Snapshoot-windows-x64-nsis
                  path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
                  if-no-files-found: error

            - name: Upload MSI installer
              uses: actions/upload-artifact@v4
              with:
                  name: Snapshoot-windows-x64-msi
                  path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
                  if-no-files-found: error

    build-macos:
        name: macOS ${{ matrix.target }}
        runs-on: macos-latest
        strategy:
            fail-fast: false
            matrix:
                target: [aarch64-apple-darwin, x86_64-apple-darwin]
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 21

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Build unsigned dmg
              run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

            - name: Upload dmg
              uses: actions/upload-artifact@v4
              with:
                  name: Snapshoot-macos-${{ matrix.target }}-dmg
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
                  if-no-files-found: error
