name: Package
# Snapshoot v1.0.0 manual release build.
# Only runs when you trigger it by hand (Actions -> Package -> Run workflow).
# One run produces exactly three artifacts:
#   - Windows x64 installer (nsis setup exe)
#   - macOS Apple silicon dmg (aarch64-apple-darwin)
#   - macOS Intel dmg (x86_64-apple-darwin)
# No release is published here and no updater signature is generated.
# The version comes from the nearest v* tag (e.g. v1.0.0 -> 1.0.0). Tags
# inherited from upstream Pot (3.0.x, updater) are ignored; the build fails
# when no v* tag is reachable instead of guessing a version.
# Artifact upload/download uses the runner's own token, so contents: read
# is the only permission needed.
on:
    workflow_dispatch:
permissions:
    contents: read

jobs:
    change-version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.outputstep.outputs.VERSION }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Install git
              run: |
                  sudo apt-get update
                  sudo apt-get install -y git
            - id: outputstep
              run: |
                  TAG=$(git describe --tags --match 'v*')
                  VERSION=$(echo "$TAG" | sed 's/^v//; s/-[0-9]*-g[0-9a-f]*$//')
                  if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "Invalid version '$VERSION' from tag '$TAG'" >&2
                      exit 1
                  fi
                  echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "$VERSION"
            - name: Change Version
              env:
                  VERSION: ${{ steps.outputstep.outputs.VERSION }}
              run: |
                  sed -i "s/\"version\":.*/\"version\": \"$VERSION\",/g" package.json
                  sed -i "s/\"version\":.*/\"version\": \"$VERSION\"/g" src-tauri/tauri.conf.json
                  sed -i "s/^version = .*/version = \"$VERSION\"/" src-tauri/Cargo.toml
                  echo "$VERSION"
            - name: Upload Artifacts for Windows
              uses: actions/upload-artifact@v4
              with:
                  name: source
                  path: ./*
                  include-hidden-files: true
                  if-no-files-found: error

    build-for-macos:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [macos-latest]
                target: [aarch64-apple-darwin, x86_64-apple-darwin]
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 21
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: Install Dependencies
              run: pnpm install
            - name: Build and Package
              run: |
                  pnpm tauri build --target ${{ matrix.target }} --bundles app
                  ARCH=aarch64
                  if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then ARCH=x64; fi
                  python3 scripts/package_macos.py --app "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Snapshoot.app" --output-dir "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" --arch "$ARCH"
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: macos_${{ matrix.target }}_dmg
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
                  if-no-files-found: error

    build-for-windows:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [windows-latest]
                target: [x86_64-pc-windows-msvc]
                include:
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      toolchain: stable-x86_64-pc-windows-msvc
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 21
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
                  rustup toolchain install --force-non-host ${{ matrix.toolchain }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: Install Dependencies
              run: pnpm install
            - name: Build and Package
              run: |
                  pnpm tauri build -b nsis --target ${{ matrix.target }}
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows_${{ matrix.target }}
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*
                  if-no-files-found: error
